# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy dotnet core project to Azure Function App - StudentFeedback-dev-api-net10

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'FeedBackApp.Backend/ValidatorMobileApp/**'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './FeedBackApp.Backend' # set this to the path to your web app project, defaults to the repository root
  DOTNET_VERSION: '10.0.x' # set this to the dotnet version to use

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 'Resolve Project Dependencies Using Dotnet'
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          dotnet publish ./AzureFunctionsAPI/ApplicationEventWorkers.csproj --configuration Release --output ./output
          popd
          
      - name: 'Debug - list output contents'
        shell: bash
        run: |
          echo "--- output root ---"
          ls -la ./FeedBackApp.Backend/output
          echo "--- .azurefunctions folder ---"
          ls -la ./FeedBackApp.Backend/output/.azurefunctions || echo "MISSING!"
          echo "--- functions.metadata size ---"
          wc -c ./FeedBackApp.Backend/output/functions.metadata || echo "MISSING!"
          echo "--- dotnet sdk version used ---"
          dotnet --version
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0B6FDB33AA714FFDAE2BBD256ED013E5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F84E211728EB49CC857F8B42355AF59C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5D02FD227E214A7BAC194DAEF9B81574 }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'StudentFeedback-dev-api-net10'
          slot-name: 'Production'
          package: '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output'
          